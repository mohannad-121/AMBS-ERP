name: ambs-erp
services:
  db:
    image: postgres:17-alpine
    container_name: ambs-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ambs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ambs]
  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ORS_API_KEY: ${ORS_API_KEY:-}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-ors}
      ROUTING_TIMEOUT_SECONDS: ${ROUTING_TIMEOUT_SECONDS:-8}
      ROUTING_REQUESTS_PER_MINUTE: ${ROUTING_REQUESTS_PER_MINUTE:-30}
      ROUTING_REQUESTS_PER_DAY: ${ROUTING_REQUESTS_PER_DAY:-1000}
      TRANSPORT_RATE_PER_KM: ${TRANSPORT_RATE_PER_KM:-}
      TRANSPORT_FIXED_RATE: ${TRANSPORT_FIXED_RATE:-}
      TRANSPORT_CURRENCY: ${TRANSPORT_CURRENCY:-AED}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?Set AUTH_ALLOWED_ORIGINS in .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_BFF_SECRET: ${AUTH_BFF_SECRET:?Set AUTH_BFF_SECRET in .env}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-1800}
      SESSION_ABSOLUTE_SECONDS: ${SESSION_ABSOLUTE_SECONDS:-28800}
      LOGIN_IDENTITY_LIMIT: ${LOGIN_IDENTITY_LIMIT:-5}
      LOGIN_IDENTITY_WINDOW_SECONDS: ${LOGIN_IDENTITY_WINDOW_SECONDS:-300}
      LOGIN_SOURCE_LIMIT: ${LOGIN_SOURCE_LIMIT:-60}
      LOGIN_SOURCE_WINDOW_SECONDS: ${LOGIN_SOURCE_WINDOW_SECONDS:-60}
      WATCHFILES_FORCE_POLLING: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ambs_item_images:/data/item-images
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ambs]
  frontend:
    build: ./frontend
    environment:
      INTERNAL_API_URL: http://backend:8000
      APP_ENV: ${APP_ENV:-development}
      AUTH_BFF_SECRET: ${AUTH_BFF_SECRET:?Set AUTH_BFF_SECRET in .env}
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      # Next's default 100 ms child cleanup budget can SIGKILL a busy dev worker.
      NEXT_EXIT_TIMEOUT_MS: "5000"
    # Replace the setup shell so Docker's SIGTERM reaches Next's shutdown handler.
    command: sh -c "npm ci --no-audit --no-fund && exec node node_modules/next/dist/bin/next dev --webpack --hostname 0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [ambs]
volumes:
  ambs_item_images:
  ambs_pg_data:
  frontend_node_modules:
  frontend_next:
networks:
  ambs:
    driver: bridge
